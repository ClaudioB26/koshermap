<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Ilustración de las principales regiones certificadoras kosher del mundo: Estados Unidos, Latinoamérica, Europa e Israel">
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563eb"/>

  <text x="600" y="86" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="700" fill="#1e293b">Certificadoras kosher en el mundo</text>
  <text x="600" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#64748b">Principales agencias por región</text>

  <!-- Tarjetas por región -->
  <g font-family="system-ui,sans-serif">
    <rect x="90" y="180" width="480" height="170" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="140" cy="230" r="22" fill="#2563eb"/>
    <text x="140" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">US</text>
    <text x="180" y="228" font-size="25" font-weight="700" fill="#1e40af">Estados Unidos</text>
    <text x="180" y="262" font-size="19" fill="#475569">OU, OK, Star-K, Kof-K</text>
    <text x="120" y="302" font-size="18" fill="#64748b">Las más grandes a nivel industrial,</text>
    <text x="120" y="328" font-size="18" fill="#64748b">con alcance de exportación global.</text>

    <rect x="630" y="180" width="480" height="170" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <circle cx="680" cy="230" r="22" fill="#16a34a"/>
    <text x="680" y="238" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">IL</text>
    <text x="720" y="228" font-size="25" font-weight="700" fill="#166534">Israel</text>
    <text x="720" y="262" font-size="19" fill="#475569">Rabanut, Badatz</text>
    <text x="660" y="302" font-size="18" fill="#64748b">Certificación estatal y tribunales</text>
    <text x="660" y="328" font-size="18" fill="#64748b">con estándares más estrictos.</text>

    <rect x="90" y="390" width="480" height="170" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="3"/>
    <circle cx="140" cy="440" r="22" fill="#d97706"/>
    <text x="140" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">LA</text>
    <text x="180" y="438" font-size="25" font-weight="700" fill="#92400e">Latinoamérica</text>
    <text x="180" y="472" font-size="19" fill="#475569">Ajdut, KMD, BDK, CK</text>
    <text x="120" y="512" font-size="18" fill="#64748b">Va'ad Hakashrut de cada comunidad,</text>
    <text x="120" y="538" font-size="18" fill="#64748b">certifican productos y restaurantes.</text>

    <rect x="630" y="390" width="480" height="170" rx="16" fill="#ffffff" stroke="#e9d5ff" stroke-width="3"/>
    <circle cx="680" cy="440" r="22" fill="#7c3aed"/>
    <text x="680" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">EU</text>
    <text x="720" y="438" font-size="25" font-weight="700" fill="#5b21b6">Europa</text>
    <text x="720" y="472" font-size="19" fill="#475569">Beth Din (Londres, París, Zúrich)</text>
    <text x="660" y="512" font-size="18" fill="#64748b">Supervisan producción local</text>
    <text x="660" y="538" font-size="18" fill="#64748b">e importaciones.</text>
  </g>

  <rect x="90" y="608" width="1020" height="110" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="600" y="654" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#1e40af">Los principios del kashrut son universales, pero cada agencia puede tener</text>
  <text x="600" y="688" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#1e40af">criterios propios sobre temas puntuales.</text>
</svg>
